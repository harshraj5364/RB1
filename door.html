<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The museum ✿</title><link rel="stylesheet" href="common.css"><style>
body{--a:#eaf6f6;--b:#d7ecee;--c:#d0def4;--ink:#3d6670;--hd:#2f7f89;--pc:#6f98a0;--f1:#a9d9de;--f2:#ffe0a8}
#dr{position:relative;width:min(270px,64vw);aspect-ratio:3/5;perspective:900px}
#lt,#dd{position:absolute;inset:0;border-radius:135px 135px 8px 8px}
#lt{background:radial-gradient(#fff8d6,#ffd98a 60%,#f6b36a);display:grid;place-items:center;text-align:center;padding:1.2rem;opacity:0;transition:opacity .8s .3s;color:#6a4a20;font-size:1.3rem;line-height:1.4}
#dd{background:linear-gradient(#7cc6bb,#4b9d95);border:4px solid var(--hd);transform-origin:left;transition:transform 1.5s cubic-bezier(.6,0,.2,1);cursor:pointer}
.open #dd{transform:rotateY(-108deg)}.open #lt{opacity:1}
.pl{position:absolute;top:24%;left:50%;translate:-50% 0;white-space:nowrap;background:#fff8e6;padding:.4rem .8rem;border-radius:6px;font-size:1rem;line-height:1.3;rotate:-2deg;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.kn{position:absolute;top:56%;left:50%;width:34px;height:34px;translate:-50% 0;border-radius:50%;background:radial-gradient(#ffe39a,#d9a441);border:3px solid #a8741f}
.k{animation:kk .35s}@keyframes kk{30%{transform:rotateY(-5deg) translateX(-3px)}60%{transform:rotateY(3deg)}}
</style></head><body data-bg="teal" data-p="18"><main>
<p class="cap rise">closed to everyone, except you.</p>
<h1 data-s>A museum for Riya</h1>
<p class="cap rise" id="t" style="--i:6">knock three times. that's the rule.</p>
<div id="dr" class="rise" style="--i:7"><div id="lt"><p>Come in, Riya.<br>Every room here is about you.</p></div><div id="dd"><div class="pl">The Museum of Riya<br>one visitor only</div><b class="kn"></b></div></div>
<p id="kc" class="cap">○ ○ ○</p>
<button class="next" data-hold>step inside</button>
</main><script src="config.js"></script><script src="common.js"></script><script>
const dd=document.getElementById('dd'),dr=document.getElementById('dr'),kc=document.getElementById('kc'),t=document.getElementById('t');let n=0;
dd.onclick=()=>{if(n>2)return;n++;dd.classList.remove('k');void dd.offsetWidth;dd.classList.add('k');kc.textContent='● '.repeat(n)+'○ '.repeat(3-n);if(n==3)setTimeout(()=>{dr.classList.add('open');t.textContent='';kc.textContent='';setTimeout(()=>nx.classList.add('show'),1800)},600)};
</script></body></html>
