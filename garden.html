<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The garden ✿</title><link rel="stylesheet" href="common.css"><style>
body{--a:#f4fbff;--b:#e4f3fb;--c:#fff3c8;--ink:#5a5a2a;--hd:#d99a00;--pc:#9a9060;--f1:#ffe08a;--f2:#bfe3a0}
#gd{position:fixed;inset:0;z-index:1;overflow:hidden;background:linear-gradient(rgba(185,225,250,.65),rgba(255,244,200,.5) 42%,rgba(150,205,100,.7) 43%,rgba(110,170,70,.85))}
#gd i{position:absolute;font-style:normal;line-height:1;transform-origin:50% 100%;animation:sw2 3s ease-in-out infinite alternate}
@keyframes sw2{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.bub{position:fixed;right:4vw;bottom:14vh;z-index:4;max-width:min(280px,60vw);background:#fff;border:3px solid var(--hd);border-radius:24px;padding:.8rem 1.1rem;font:500 1.4rem/1.3 'Caveat',cursive}
.cat2{position:fixed;right:3vw;bottom:3vh;z-index:4;font-size:4.4rem}.back{z-index:6}
</style></head><body data-p="18"><main>
<button class="btn back" onclick="go('gifts.html')">← back</button>
<div id="gd"></div>
<p class="bub">A bouquet is not enough for you, so I brought the whole garden. 🌻</p>
<div class="cat2">🐱</div>
</main><script src="config.js"></script><script src="common.js"></script><script>
let h='';
for(let r=0;r<9;r++){const y=44+r*r*.5+r*2,sz=18+r*r*1.2;for(let c=0;c<6+r*2;c++)h+=`<i style="left:${R(-2,100)}%;top:${y}%;font-size:${sz}px;animation-delay:${R(-3,0).toFixed(1)}s">🌻</i>`}
document.getElementById('gd').innerHTML=h;
</script></body></html>
